
org: carloscondort5ii
service: api-web-scraping-igp

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: dev
  memorySize: 256
  timeout: 30
  iam:
    role: arn:aws:iam::512118829948:role/LabRole
  environment:
    TABLE_NAME: TablaSismosIGP

package:
  patterns:
    - ./**

functions:
  scrape_sismos:
    handler: scrap_sismos.lambda_handler
    events:
      - http:
          path: scrape/sismos
          method: get
          cors: true
          integration: lambda-proxy

resources:
  Resources:
    TablaSismosIGP:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: TablaSismosIGP
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
